name: Archivia statistiche traffico

# Fotografa le API Traffico di GitHub (visite, referrer, pagine) e le
# accoda in stats/ nel repo. Nessuna terza parte, nessun cookie.
# Le API coprono solo gli ultimi 14 giorni: il giro settimanale basta.
# Nota: le API Traffico rifiutano il GITHUB_TOKEN automatico (403), serve
# un PAT personale salvato nel secret TRAFFIC_TOKEN (scope public_repo).

on:
  schedule:
    - cron: '0 6 * * 1' # lunedi 06:00 UTC
  workflow_dispatch: # giro manuale dalla tab Actions

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Archivia traffico
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/archive_traffic.py
      - name: Commit se cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/
          git diff --cached --quiet || git commit -m "stats: traffico settimanale $(date +%F)"
          git push
